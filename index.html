<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f9ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Forge Gym">
  <meta name="description" content="Diario palestra, schede personalizzate, progressi e suggerimenti sui carichi, anche offline.">
  <link rel="icon" type="image/png" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script>try{const x=localStorage.getItem('forge-gym-theme');document.documentElement.dataset.theme=['light','dark','auto'].includes(x)?x:'auto'}catch{document.documentElement.dataset.theme='auto'}</script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./theme.css">
  <title>Forge Gym — Il tuo diario di allenamento</title>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <script src="./seed.js" defer></script>
  <script src="./core.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
